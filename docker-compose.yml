services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: stock-desk:local
    container_name: stock-desk
    ports:
      - '${WEB_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      # Optional. Without a key the category suggester runs its offline
      # lexical adapter, so the container boots with no secrets at all.
      AI_API_KEY: '${AI_API_KEY:-}'
      AI_BASE_URL: '${AI_BASE_URL:-}'
      AI_MODEL: '${AI_MODEL:-}'
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
